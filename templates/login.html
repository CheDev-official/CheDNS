<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · CheDNS</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon.ico">
<style>
  :root {
    --bg-base: #05070d;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --accent-blue: #3b82f6;
    --accent-cyan: #06b6d4;
    --accent-green: #10b981;
    --accent-red: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    position: relative;
  }

  /* Фон */
  .bg-effects {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.5;
    animation: float 14s ease-in-out infinite;
  }
  .orb-1 { width: 500px; height: 500px; background: var(--accent-blue); top: -150px; left: -150px; }
  .orb-2 { width: 420px; height: 420px; background: var(--accent-cyan); bottom: -120px; right: -120px; animation-delay: -5s; }
  .orb-3 { width: 320px; height: 320px; background: var(--accent-green); top: 45%; left: 50%; transform: translate(-50%,-50%); opacity: 0.18; animation-delay: -9s; }
  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 78%);
  }
  @keyframes float {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px,-40px) scale(1.12); }
  }

  /* Карточка */
  .login-card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(35px) saturate(180%);
    -webkit-backdrop-filter: blur(35px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: cardEntry 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes cardEntry {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo-box {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(16,185,129,0.18), rgba(6,182,212,0.18));
    border: 1px solid rgba(16,185,129,0.3);
  }
  .logo-box svg { width: 32px; height: 32px; }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: rgba(0,0,0,0.3);
    color: var(--text-main);
    font-size: 15px;
    font-family: inherit;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }
  input::placeholder { color: var(--text-dim); }

  .btn {
    width: 100%;
    padding: 13px 20px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    color: white;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
    margin-top: 8px;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(59,130,246,0.4);
  }
  .btn:active { transform: translateY(0); }

  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .error::before { content: '⚠'; font-size: 16px; }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 20px;
    line-height: 1.6;
  }
  .hint code {
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent-cyan);
    font-size: 12px;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .footer a { color: var(--accent-cyan); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="bg-effects">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>
</div>

<div class="login-card">
  <div class="logo-box">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#34d399"/>
          <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
      </defs>
      <circle cx="12" cy="12" r="9" stroke="url(#g)" stroke-width="1.5" fill="url(#g)" fill-opacity="0.15"/>
      <path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18" stroke="url(#g)" stroke-width="1.3" fill="none"/>
    </svg>
  </div>

  <h1>CheDNS</h1>
  <div class="subtitle">Вход в панель управления</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="form-group">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" autofocus required>
    </div>
    <div class="form-group">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" placeholder="••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Войти</button>
  </form>

  <div class="hint">
    По умолчанию: <code>admin</code> / <code>admin</code><br>
    Смени пароль после первого входа!
  </div>

  <div class="footer">
    CheDNS v{{ version }} · <a href="https://github.com/CheDev-official/CheDNS" target="_blank">GitHub</a>
  </div>
</div>

</body>
</html>
